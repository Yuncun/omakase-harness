name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vet, test, build
        run: |
          go vet ./... && go test ./... && CGO_ENABLED=0 go build -o dist/omakase ./cmd/omakase
      - name: Run test suites
        run: |
          export OMAKASE_BIN="$PWD/dist/omakase"
          rc=0
          for t in tests/*.test.sh; do
            echo "=== $t ==="
            bash "$t" || rc=1
          done
          exit $rc

  tests-no-go:
    # Covers the plugin-only machine shape (issue #182): no Go toolchain, no
    # binary — the shims must refuse with the one-line brew instruction, and
    # a seeded stable machine copy must resolve offline. GitHub's runners
    # preinstall Go, so this runs in a slim Debian container that genuinely
    # lacks one.
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      # git is absent from the slim image. Debian's base already carries bash,
      # coreutils, tar, findutils, and mawk. Nothing here needs the network:
      # resolution is local-only since #182.
      - name: Install suite dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - name: Assert no Go toolchain
        run: |
          if command -v go >/dev/null 2>&1; then
            echo "expected no Go toolchain, but found $(command -v go)" >&2
            exit 1
          fi
      - name: Trust the checkout despite the container's differing owner
        run: git config --global safe.directory '*'
      - name: Run the resolution suite without a Go toolchain
        run: bash tests/omakase-resolve.test.sh

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vet, test, build
        run: |
          go vet ./... && go test ./... && CGO_ENABLED=0 go build -o dist/omakase ./cmd/omakase
      - name: Run test suites
        run: |
          export OMAKASE_BIN="$PWD/dist/omakase"
          rc=0
          for t in tests/*.test.sh; do
            echo "=== $t ==="
            bash "$t" || rc=1
          done
          exit $rc

  # Windows (#212). Separate job, not a matrix row: the binary needs the
  # .exe name, checkout needs the CRLF guard (bash refuses \r\n scripts),
  # and the shell suites run under Git for Windows' bash — the same
  # environment a Windows user's git hooks run in.
  tests-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep checkout bytes exact (no CRLF conversion)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go vet, test, build
        run: |
          go vet ./... && go test ./... && CGO_ENABLED=0 go build -o dist/omakase.exe ./cmd/omakase
      - name: Run test suites
        run: |
          export OMAKASE_BIN="$PWD/dist/omakase.exe"
          rc=0
          for t in tests/*.test.sh; do
            echo "=== $t ==="
            bash "$t" || rc=1
          done
          exit $rc

# GoReleaser config — cross-compiles the omakase binary, publishes it as a
# GitHub Release, and updates the Homebrew cask in Yuncun/homebrew-tap. Driven
# by .github/workflows/release.yml on a vX.Y.Z tag push.
#
# PUBLISH LINE: pushing a vX.Y.Z tag IS publishing — the release and the cask
# ship in the same unattended run. Runbook: docs/releasing.md.
version: 2

project_name: omakase

builds:
  - id: omakase
    main: ./cmd/omakase
    binary: omakase
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: omakase
    formats: [tar.gz]
    # Windows tooling (scoop included) expects zip.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  # Published immediately: the cask below points at this release's tarballs in
  # the same run, and a cask pointing at a draft 404s for users. Pushing the
  # tag is therefore the outward "publish line" — see docs/releasing.md.
  draft: false

# Homebrew tap — each release rewrites the cask in Yuncun/homebrew-tap; users
# install with `brew install yuncun/tap/omakase`. (homebrew_casks is GoReleaser
# v2's replacement for the deprecated `brews`; validated against 2.16.)
homebrew_casks:
  - name: omakase
    repository:
      owner: Yuncun
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Yuncun/omakase-harness"
    description: "Install a repo's local dev harness as a gitignored overlay"
    license: MIT
    # The binary is unsigned (no Apple Developer ID), and Homebrew quarantines
    # cask downloads — Gatekeeper SIGKILLs an unsigned quarantined binary on
    # first run. This post-install hook is GoReleaser's documented pattern for
    # exactly that case; proper signing/notarization is the eventual fix.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/omakase"]
          end

# Scoop bucket — the Windows install channel (#212), same shape as the brew
# tap: each release rewrites the manifest in Yuncun/scoop-bucket; users run
#   scoop bucket add yuncun https://github.com/Yuncun/scoop-bucket
#   scoop install omakase
scoops:
  - name: omakase
    repository:
      owner: Yuncun
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Yuncun/omakase-harness"
    description: "Install a repo's local dev harness as a gitignored overlay"
    license: MIT

# winget — the second Windows channel: users run `winget install Yuncun.omakase`.
# Unlike brew/scoop, publishing is a pull request into microsoft/winget-pkgs
# that a Microsoft pipeline validates and a moderator merges — the release run
# pushes generated manifests to the Yuncun/winget-pkgs fork and opens the PR;
# availability follows moderation, not the tag push. The token must be
# SSO-authorized for the Microsoft org or the PR step fails (release, cask,
# scoop, and the fork push all land first — runbook: docs/releasing.md).
winget:
  - name: omakase
    publisher: Yuncun
    package_identifier: Yuncun.omakase
    short_description: "Install a repo's local dev harness as a gitignored overlay"
    license: MIT
    license_url: "https://github.com/Yuncun/omakase-harness/blob/main/LICENSE"
    homepage: "https://github.com/Yuncun/omakase-harness"
    publisher_url: "https://github.com/Yuncun"
    publisher_support_url: "https://github.com/Yuncun/omakase-harness/issues"
    release_notes_url: "https://github.com/Yuncun/omakase-harness/releases/tag/v{{ .Version }}"
    repository:
      owner: Yuncun
      name: winget-pkgs
      branch: "omakase-{{ .Version }}"
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
